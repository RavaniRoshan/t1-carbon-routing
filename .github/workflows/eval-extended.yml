name: eval-extended
on:
  workflow_dispatch: {}
  push:
    paths: ["eval/sensitivity.py", "eval/pareto.py"]
jobs:
  extended:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 eval/sensitivity.py
      - run: python3 eval/pareto.py
      - uses: actions/upload-artifact@v4
        with:
          name: eval-extended
          path: |
            sensitivity.csv
            pareto.csv
