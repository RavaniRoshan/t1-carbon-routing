name: router-test
on:
  workflow_dispatch: {}
  push:
    paths: ["router/**", "tests/**", "conftest.py", ".github/workflows/router-test.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pytest
      - run: python3 -m pytest tests/ -q
