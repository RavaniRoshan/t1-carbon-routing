name: novelty-sweep
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 1 * *"
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - run: curl -s -m 30 "http://export.arxiv.org/api/query?search_query=all:carbon-aware+LLM+routing&start=0&max_results=20&sortBy=submittedDate&sortOrder=descending" -o arxiv.xml
      - run: python3 -c "import re; x=open('arxiv.xml').read(); print('entries:', x.count('<entry>'))"
      - uses: actions/upload-artifact@v4
        with:
          name: novelty-sweep
          path: arxiv.xml
